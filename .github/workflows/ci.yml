name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Determine pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm -r run build

      - name: Run tests
        run: pnpm -r run test

      - name: Validate example workflows
        run: node packages/cli/dist/index.js validate examples/workflows/order_fulfillment.yaml

      - name: Generate diagrams
        run: node packages/cli/dist/index.js diagram examples/workflows/order_fulfillment.yaml --out artifacts/diagrams

      - name: Generate Temporal artifacts
        run: node packages/cli/dist/index.js build examples/workflows/order_fulfillment.yaml --target temporal --out generated

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orkestr-generated
          path: |
            artifacts/diagrams
            generated
